name: Refresh GitHub Stats Cache

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours automatically
  workflow_dispatch:

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Cache Invalidation
        run: |
          curl -s "https://github-readme-stats-eight-theta.vercel.app/api?username=arinupadhyay&cache_seconds=0" > /dev/null
          curl -s "https://github-readme-stats-eight-theta.vercel.app/api/top-langs/?username=arinupadhyay&cache_seconds=0" > /dev/null
